# OCLive VS Code Flash — Pro 简洁版（explicit six-slot matrix）
# SSOT mirror: oclivenewnew/examples/distro-profiles/vscode.oclive.toml
# See creator-docs/kernel/DISTRO_DEFAULT_PLUGINS.md §3.2

schema_version = 1
distro_id = "vscode"
display_name = "OCLive VS Code Flash"

[interaction]
default_mode = "pure_chat"
allow_mode_switch = false

[host_flags]
skip_agent = true
skip_complex_emotion = true

[slots]
complex_emotion = "off"

[prompt]
profile = "concise"

[state_expression]
favor_high = "更信任用户的技术判断，少寒暄"
favor_mid  = "保持友好但不越界"
favor_low  = "保持距离与礼貌"

[memory]
retrieval = "light"

[post_process]
chain = "minimal"

[user_identity]
default_id = "classmate"

[plugin_backends]
memory = "builtin"
emotion = "builtin"
event = "builtin"
prompt = "builtin"
llm = "ollama"
