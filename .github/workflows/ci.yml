name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ci-vscode-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  vscode:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: oclive-vscode
    steps:
      - uses: actions/checkout@v4
        with:
          path: oclive-vscode
      - uses: actions/checkout@v4
        with:
          repository: linkaiheng2233-cyber/oclive-vscode-host
          path: oclive-vscode-host
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: oclive-vscode/package-lock.json
      - name: Build @oclive/vscode-host
        run: cd ../oclive-vscode-host && npm ci && npm run build
      - run: npm ci
      - run: npm run compile:all
      - run: npm run lint
      - run: npm run smoke
      - run: npm run test:unit
      - run: npm run test:capability
      - run: npm run test:ensure-report
