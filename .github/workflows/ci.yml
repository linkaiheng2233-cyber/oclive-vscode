name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ci-vscode-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  vscode:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: oclive-vscode
    steps:
      - uses: actions/checkout@v4
        with:
          path: oclive-vscode
      - uses: actions/checkout@v4
        with:
          repository: linkaiheng2233-cyber/oclive-vscode-host
          path: oclive-vscode-host
          ref: main
      - uses: actions/checkout@v4
        with:
          repository: linkaiheng2233-cyber/oclivenewnew
          path: oclivenewnew
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: oclive-vscode/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: oclivenewnew
      - run: npm ci
      - name: Overlay @oclive/vscode-host from sibling pack
        run: |
          cd ../oclive-vscode-host && npm ci && npm run build && npm pack
          cd ../oclive-vscode && npm install ../oclive-vscode-host/oclive-vscode-host-*.tgz
      - name: Build oclive-kernel-server and oclive-cli
        working-directory: oclivenewnew
        run: cargo build -p oclive_kernel_server -p oclive-cli
      - run: npm run compile:all
      - run: npm run lint
      - name: Smoke (spawn → chat)
        env:
          OCLIVE_ROLES_DIR: ${{ github.workspace }}/oclivenewnew/roles
        run: |
          TARGET="$(cd ../oclivenewnew && cargo metadata --format-version=1 --no-deps | python -c "import json,sys; print(json.load(sys.stdin)['target_directory'])")"
          export OCLIVE_KERNEL_BINARY="$TARGET/debug/oclive-kernel-server"
          npm run smoke
      - run: npm run test:unit
      - run: npm run test:capability
      - run: npm run test:ensure-report
